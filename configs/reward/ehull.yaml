# reward for energy above the convex hull (Ehull, eV/atom) computed by MatterSim
# Lower Ehull is better; stable structures have Ehull <= 0 eV/atom.
# Reward scaling: reward = max(0, min(1, 1 - ehull))
#   ehull = 0.0  -> reward = 1.0  (on the hull)
#   ehull = 0.1  -> reward = 0.9  (stability threshold)
#   ehull = 1.0  -> reward = 0.0
_target_: rewards.reward.Reward

root_dir: rewards

prop_cfg:
  - name: ehull
    calculator:
      _target_: rewards.calculators.FakeEhull
      root_dir: rewards/ehull
      task: ehull
    target: descending
    minv: -0.1
    maxv: 0.125

reward_threshold: 0.6
