# global setting
expname: test
results_dir: exp_res
device: cuda

# RL
rl_epoch: 200

# sampling
sample_cfg:
  num_batches: 1
  max_num: ${eval_size}
  filter:
    _target_: pipeline.filters.opt_filter.OptFilter
    metrics:
      - validity
      - novel
      - unique
    device: ${device}
    silent: True
    relax: False

# rewards and finetune
# maximum number of samples to score per RL loop
eval_size: 32

hydra:
  run:
    dir: ${results_dir}/${expname}
    # dir: ${results_dir}/${expname}-${now:%Y-%m-%d_%H-%M-%S}

defaults:
  - pipeline: mat_invent
  - model: mattergen
  - reward: ehull
  - logger: wandb
